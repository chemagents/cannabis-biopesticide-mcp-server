[project]
name = "cannabis-biopesticide-mcp-server"
version = "0.2.1"
description = "Scientific MCP server for cannabis; shared ChemAgents runtime"
requires-python = ">=3.12,<3.13"
dependencies = ["chem-repro-suite @ git+https://github.com/chemagents/chem-repro-suite.git@67da19228ed187a971d03790579d669ca5b5a16a"]

[project.scripts]
cannabis-biopesticide-mcp-server = "cannabis_biopesticide_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cannabis_biopesticide_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

